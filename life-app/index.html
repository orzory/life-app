<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fbbf24" />
  <title>我的小日子</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 手机端用的菜单按钮（点开左侧导航抽屉） -->
  <button id="menuBtn" class="menu-btn" aria-label="菜单">☰</button>
  <!-- 抽屉打开时的灰色遮罩 -->
  <div id="overlay" class="overlay"></div>

  <div class="layout">
    <!-- 左侧纵向导航栏（电脑常驻，手机变抽屉） -->
    <aside class="sidebar">
      <div class="brand">🌼 我的小日子</div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">数据仅存于本机 🔒</div>
    </aside>

    <!-- 主内容区（仪表盘 / 各模块）由 app.js 渲染 -->
    <main id="view" class="view"></main>
  </div>

  <!-- 灵感便签弹窗（静态常驻，不被 #view 重渲染影响） -->
  <div class="modal-mask" id="ideaModal">
    <div class="modal note">
      <div class="note-head">💡 写点灵感…</div>
      <textarea id="noteText" class="note-text" placeholder="突然冒出来的点子、一句话、灵感碎片…"></textarea>
      <div class="note-img-row">
        <label class="note-img-btn">📷 加图片
          <input type="file" id="noteImg" accept="image/*" hidden>
        </label>
        <div class="note-img-preview" id="noteImgPrev"></div>
      </div>
      <div class="note-actions">
        <button id="noteCancel" class="btn-cancel" type="button">取消</button>
        <button id="noteSave" class="btn-save" type="button">保存便签</button>
      </div>
    </div>
  </div>

  <!-- Tesseract.js：上传运动截图后做 OCR 识别中文（首次需在线下载约 10MB 语言包） -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
