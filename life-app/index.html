<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f9f7f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>My Daily Routine</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png?v83" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v83" />
  <!-- 关键首屏样式内联：先铺好米色底 + 手写体兜底 + 图标/骨架布局，杜绝白屏和图标爆大 -->
  <style>
    :root{
      --bg:#f9f7f2; --sidebar:#f4f1e9; --sidebar-2:#ece7db; --card:#fffefb;
      --primary:#3d3a35; --primary-d:#2a2824; --text:#2d2a26; --muted:#8b8374;
      --line:#d9d3c5; --danger:#b85c4f; --ink:#2d2a26;
      --r:16px; --r-sm:10px; --r-xs:8px; --bd:2px dashed #d9d3c5;
      --sx:0.88; --fs:1.15;
    }
    *,*::before,*::after{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;height:100%;width:100%;overflow-x:hidden;touch-action:pan-y;
      background:#f9f7f2;color:#2d2a26;
      font-family:"Chalkboard SE","Comic Sans MS","Yuanti SC","YouYuan","STKaiti",cursive,sans-serif;}
    input,textarea,button,select{font-family:inherit;font-size:inherit;color:inherit;}
    .ic{width:1.15em;height:1.15em;vertical-align:-0.18em;flex:none;display:inline-block;}
    .nav-icon .ic{width:22px;height:22px;vertical-align:-5px;}
    .menu-btn .ic{width:22px;height:22px;vertical-align:middle;}
    .brand .ic,.note-img-btn .ic,.day-head .ic,.note-head .ic{margin-right:4px;vertical-align:-0.18em;}
    .status-bar-fill{position:fixed;top:0;left:0;right:0;z-index:9999;height:env(safe-area-inset-top);background:#f9f7f2;pointer-events:none;}
    .menu-btn{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:30;width:44px;height:44px;border:none;border-radius:10px;background:#fff;color:#2d2a26;font-size:calc(18px * 1.15);display:none;box-shadow:2px 3px 0 rgba(0,0,0,.08);}
    .overlay{position:fixed;inset:0;background:rgba(45,42,38,.25);z-index:18;display:none;}
    .overlay.show{display:block;}
    .layout{display:flex;min-height:100vh;width:100%;max-width:100%;overflow-x:hidden;}
    .sidebar{width:230px;flex-shrink:0;background:#f4f1e9;padding:16px 14px;display:flex;flex-direction:column;border-right:2px dashed #d9d3c5;}
    .brand{font-size:calc(20px * 1.15);font-weight:700;padding:6px 10px 12px;color:#2d2a26;letter-spacing:.5px;transform:scaleX(0.88);transform-origin:left center;}
    .nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;transform:scaleX(0.88);transform-origin:left center;}
    .sidebar-foot{font-size:calc(12px * 1.15);color:#8b8374;text-align:center;padding-top:10px;transform:scaleX(0.88);transform-origin:center;}
    .view{padding:22px;flex:1;max-width:720px;margin:0 auto;width:100%;min-width:0;transform:scaleX(0.88);}
    .modal-mask{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(45,42,38,.25);padding:18px;overflow-x:hidden;overflow-y:auto;}
    .modal-mask.show{display:flex;}
    .modal{width:100%;max-width:440px;background:#fff;border:2px dashed #d9d3c5;border-radius:16px;padding:20px;box-shadow:5px 7px 0 rgba(0,0,0,.12);transform:scaleX(0.88);}
    .day-head{font-size:calc(18px * 1.15);font-weight:700;color:#2d2a26;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;}
    .btn-cancel{flex:1;border:none;background:#fff;color:#8b8374;border-radius:10px;padding:11px;font-size:calc(15px * 1.15);cursor:pointer;}
    #boot-msg{padding:120px 24px;text-align:center;color:#7a746b;font-size:16px;}
    @media(max-width:720px){
      .layout{display:block;}
      .menu-btn{display:block;}
      .sidebar{position:fixed;top:0;left:0;height:100%;z-index:19;transform:translateX(-110%);transition:transform .25s ease;box-shadow:3px 0 12px rgba(0,0,0,.12);}
      .sidebar.open{transform:translateX(0);}
      .view{padding:14px;padding-top:calc(14px + env(safe-area-inset-top));}
      .brand{padding-top:calc(28px + env(safe-area-inset-top));}
    }
  </style>
  <!-- 主样式（含 3.7MB 内联字体）：阻塞加载，iOS PWA 最可靠；
       首屏已由上方关键 CSS 铺好底色和骨架，不会白屏 -->
  <link rel="stylesheet" href="style.css?v158" />
</head>
<body>
  <!-- iOS 状态栏背景填充：让 PWA 顶部颜色和侧边栏统一 -->
  <div class="status-bar-fill" aria-hidden="true"></div>

  <!-- 手机端用的菜单按钮（点开左侧导航抽屉） -->
  <button id="menuBtn" class="menu-btn" aria-label="菜单"><span class="ic" data-ic="menu"></span></button>
  <!-- 抽屉打开时的灰色遮罩 -->
  <div id="overlay" class="overlay"></div>

  <div class="layout">
    <!-- 左侧纵向导航栏（电脑常驻，手机变抽屉） -->
    <aside class="sidebar">
      <div class="brand"><span class="ic" data-ic="flower"></span> My Daily Routine</div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot"><span class="ic" data-ic="lock"></span></div>
    </aside>

    <!-- 主内容区（仪表盘 / 各模块）由 app.js 渲染 -->
    <main id="view" class="view">
      <div id="boot-msg" style="padding:120px 24px;text-align:center;color:#7a746b;font-size:16px;">
        正在加载 My Daily Routine…<br>
        <span style="font-size:13px;opacity:.7;">若长时间空白，请检查网络或杀 App 重开</span>
      </div>
    </main>
  </div>

  <!-- 灵感便签弹窗（静态常驻，不被 #view 重渲染影响） -->
  <div class="modal-mask" id="ideaModal">
    <div class="modal note">
      <div class="note-head"><span class="ic" data-ic="spark"></span> 写点灵感…</div>
      <textarea id="noteText" class="note-text" placeholder="突然冒出来的点子、一句话、灵感碎片…"></textarea>
      <div class="note-img-row">
        <label class="note-img-btn"><span class="ic" data-ic="camera"></span> 加图片
          <input type="file" id="noteImg" accept="image/*" hidden>
        </label>
        <div class="note-img-preview" id="noteImgPrev"></div>
      </div>
      <div class="note-actions">
        <button id="noteCancel" class="btn-cancel" type="button">取消</button>
        <button id="noteSave" class="btn-save" type="button">保存便签</button>
      </div>
    </div>
  </div>

  <!-- 月历：点带记录的日期，弹出当天各模块记录 -->
  <div class="modal-mask" id="dayModal">
    <div class="modal day">
      <div class="day-head"><span class="ic" data-ic="cal"></span> 当日记录 <span id="dayModalDate" class="day-date"></span></div>
      <div class="day-body" id="dayModalBody"></div>
      <div class="day-actions">
        <button id="dayModalCancel" class="btn-cancel" type="button">关闭</button>
      </div>
    </div>
  </div>

  <!-- 运动记录录入弹窗：截图识别或手动添加时弹出 -->
  <div class="modal-mask" id="sportFormModal">
    <div class="modal sport-form-modal">
      <div class="day-head"><span class="ic" data-ic="run"></span> 添加运动记录</div>
      <form id="sport-form" class="add-form modal-form">
        <!-- 字段由 app.js 在打开弹窗时填充 -->
      </form>
      <div class="day-actions">
        <button id="sportFormCancel" class="btn-cancel" type="button">取消</button>
        <button type="submit" form="sport-form" class="btn-primary">+ 添加</button>
      </div>
    </div>
  </div>

  <!-- 日记查看弹窗：从月历点「絮絮叨叨」时只读弹出 -->
  <div class="modal-mask" id="diaryViewModal">
    <div class="modal diary-view-modal">
      <div class="day-head"><span class="ic" data-ic="spark"></span> 絮絮叨叨 <span id="diaryViewDate" class="day-date"></span></div>
      <div class="diary-view-body" id="diaryViewBody"></div>
      <div class="day-actions">
        <button id="diaryViewCancel" class="btn-cancel" type="button">关闭</button>
      </div>
    </div>
  </div>

  <!-- Tesseract.js 改为“点击 OCR 时才动态加载”，避免外部脚本阻塞首屏 -->
  <script>
    // 主脚本加载失败时给出明确提示，避免纯白屏
    function onAppError() {
      document.body.innerHTML = '<div style="padding:120px 24px;text-align:center;color:#7a746b;font-size:16px;">' +
        'My Daily Routine 加载失败<br><span style="font-size:13px;opacity:.7;">请检查网络，或杀掉 App 重新打开</span></div>';
    }
    window.addEventListener('error', function(e) { onAppError(); });
  </script>
  <script src="app.js?v158" onerror="onAppError()"></script>
</body>
</html>
