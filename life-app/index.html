<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f9f7f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Oh My Day!</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png?v83" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v83" />
  <!-- 中文字体已 base64 内联进 style.css，无需单独 preload -->
  <link rel="stylesheet" href="style.css?v125" />
</head>
<body>
  <!-- iOS 状态栏背景填充：让 PWA 顶部颜色和侧边栏统一 -->
  <div class="status-bar-fill" aria-hidden="true"></div>

  <!-- 手机端用的菜单按钮（点开左侧导航抽屉） -->
  <button id="menuBtn" class="menu-btn" aria-label="菜单"><span class="ic" data-ic="menu"></span></button>
  <!-- 抽屉打开时的灰色遮罩 -->
  <div id="overlay" class="overlay"></div>

  <div class="layout">
    <!-- 左侧纵向导航栏（电脑常驻，手机变抽屉） -->
    <aside class="sidebar">
      <div class="brand"><span class="ic" data-ic="flower"></span> Oh My Day!</div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot"><span class="ic" data-ic="lock"></span></div>
    </aside>

    <!-- 主内容区（仪表盘 / 各模块）由 app.js 渲染 -->
    <main id="view" class="view">
      <div id="boot-msg" style="padding:120px 24px;text-align:center;color:#7a746b;font-size:16px;">
        正在加载 Oh My Day…<br>
        <span style="font-size:13px;opacity:.7;">若长时间空白，请检查网络或杀 App 重开</span>
      </div>
    </main>
  </div>

  <!-- 灵感便签弹窗（静态常驻，不被 #view 重渲染影响） -->
  <div class="modal-mask" id="ideaModal">
    <div class="modal note">
      <div class="note-head"><span class="ic" data-ic="spark"></span> 写点灵感…</div>
      <textarea id="noteText" class="note-text" placeholder="突然冒出来的点子、一句话、灵感碎片…"></textarea>
      <div class="note-img-row">
        <label class="note-img-btn"><span class="ic" data-ic="camera"></span> 加图片
          <input type="file" id="noteImg" accept="image/*" hidden>
        </label>
        <div class="note-img-preview" id="noteImgPrev"></div>
      </div>
      <div class="note-actions">
        <button id="noteCancel" class="btn-cancel" type="button">取消</button>
        <button id="noteSave" class="btn-save" type="button">保存便签</button>
      </div>
    </div>
  </div>

  <!-- 月历：点带记录的日期，弹出当天各模块记录 -->
  <div class="modal-mask" id="dayModal">
    <div class="modal day">
      <div class="day-head"><span class="ic" data-ic="cal"></span> 当日记录 <span id="dayModalDate" class="day-date"></span></div>
      <div class="day-body" id="dayModalBody"></div>
      <div class="day-actions">
        <button id="dayModalCancel" class="btn-cancel" type="button">关闭</button>
      </div>
    </div>
  </div>

  <!-- 运动记录录入弹窗：截图识别或手动添加时弹出 -->
  <div class="modal-mask" id="sportFormModal">
    <div class="modal sport-form-modal">
      <div class="day-head"><span class="ic" data-ic="run"></span> 添加运动记录</div>
      <form id="sport-form" class="add-form modal-form">
        <!-- 字段由 app.js 在打开弹窗时填充 -->
      </form>
      <div class="day-actions">
        <button id="sportFormCancel" class="btn-cancel" type="button">取消</button>
        <button type="submit" form="sport-form" class="btn-primary">+ 添加</button>
      </div>
    </div>
  </div>

  <!-- Tesseract.js 改为“点击 OCR 时才动态加载”，避免外部脚本阻塞首屏 -->
  <script>
    // 主脚本加载失败时给出明确提示，避免纯白屏
    function onAppError() {
      document.body.innerHTML = '<div style="padding:120px 24px;text-align:center;color:#7a746b;font-size:16px;">' +
        'Oh My Day 加载失败<br><span style="font-size:13px;opacity:.7;">请检查网络，或杀掉 App 重新打开</span></div>';
    }
    window.addEventListener('error', function(e) { onAppError(); });
  </script>
  <script src="app.js?v125" onerror="onAppError()"></script>
</body>
</html>
