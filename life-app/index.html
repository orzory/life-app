<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f9f7f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>My Daily Routine</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png?v166" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v166" />
  <!-- 预热字体：crossorigin 必须与 @font-face 的 cors 请求一致，否则预加载不匹配 -->
  <link rel="preload" href="https://gcore.jsdelivr.net/gh/orzory/life-app@main/life-app/font.woff2" as="font" type="font/woff2" crossorigin />
  <!-- 关键首屏样式内联：先铺好米色底 + 手写体兜底，杜绝白屏；主样式随后无缝接管 -->
  <style>
@font-face{font-family:'Donut';src:url('https://gcore.jsdelivr.net/gh/orzory/life-app@main/life-app/font.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
/* 关键首屏样式内联（含 @font-face 指向独立 font.woff2 文件，WKWebView 支持外部 URL 字体） */
/* =========================================================================
   我的小日子 —— grug 手绘风（v50：灰色虚线边框 + 规则圆角）
   纸张底色 + 手写体 + 灰色虚线边框 + 统一规则圆角
   ========================================================================= */
:root{
  --bg:#f9f7f2;          /* 纸白底 */
  --sidebar:#f4f1e9;     /* 侧边栏 */
  --sidebar-2:#ece7db;   /* 侧边栏按下 */
  --card:#fffefb;        /* 卡片 */
  --primary:#3d3a35;     /* 主色 深炭/墨水 */
  --primary-d:#2a2824;   /* 主色按下 */
  --text:#2d2a26;        /* 文字 近黑 */
  --muted:#8b8374;       /* 次要文字 */
  --line:#d9d3c5;        /* 边线 铅笔灰 */
  --danger:#b85c4f;      /* 删除红 */
  --ink:#2d2a26;
  /* 规则圆角尺度 */
  --r:16px;              /* 大卡片/弹窗 */
  --r-sm:10px;           /* 小按钮/输入框 */
  --r-xs:8px;            /* 复选框 */
  /* 灰色虚线边框（统一） */
  --bd:2px dashed var(--line);
  /* 甜甜圈体只有单一字重，无法用 font-weight 变细；
     用极轻微的水平压缩让竖笔变细、整体更秀气（0.88≈细 12%；想更细调小、更粗调大） */
  --sx:0.88;
  /* 整体字号旋钮：1=原生，>1 大一号，<1 小一号。
     所有 font-size 已改为 calc(Npx * var(--fs))，改这一处即全局缩放 */
  --fs:1.15;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%; position:relative; width:100%; overflow-x:hidden; touch-action:pan-y;}
body{
  font-family:"Donut","Chalkboard SE","Comic Sans MS","Marker Felt","Yuanti SC","YouYuan","STKaiti","KaiTi",cursive,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6;
  letter-spacing:.2px;
}
/* 强制表单元素继承手写体，避免 iOS 用系统默认字体 */
input,textarea,button,select,optgroup,option{font-family:inherit; font-size:inherit; color:inherit;}
/* 文件选择控件的系统按钮文字也要继承字体（iOS Safari 默认用系统字） */
input[type=file], input[type=file]::-webkit-file-upload-button, input[type=file]::file-selector-button{
  font-family:inherit; font-size:inherit; color:inherit;
}

/* 手绘风 SVG 图标：继承文字色（单色线条），尺寸随字号，垂直居中 */
.ic{width:1.15em; height:1.15em; vertical-align:-0.18em; flex:none; display:inline-block;}
.nav-icon .ic{width:22px; height:22px; vertical-align:-5px;}
.wx-ic{width:2.4em; height:2.4em; flex:none; vertical-align:middle; margin-right:4px;}
.btn-launch .ic, .note-img-btn .ic, .day-head .ic, .note-head .ic, .brand .ic{margin-right:4px; vertical-align:-0.18em;}
.menu-btn .ic{width:22px; height:22px; vertical-align:middle;}
/* iOS PWA 状态栏背景统一：和主背景色一致 */
.status-bar-fill{
  position:fixed; top:0; left:0; right:0; z-index:9999;
  height:env(safe-area-inset-top);
  background:var(--bg);
  pointer-events:none;
}

/* ---- 手机端菜单按钮 + 遮罩 ---- */
.menu-btn{
  position:fixed; top:calc(10px + env(safe-area-inset-top)); left:10px; z-index:30;
  width:44px; height:44px; border:none; border-radius:var(--r-sm);
  background:#fff; color:var(--ink); font-size:calc(18px * var(--fs)); display:none;
  box-shadow:2px 3px 0 rgba(0,0,0,.08);
}
.menu-btn:active{transform:translate(1px,2px); box-shadow:none;}
.overlay{position:fixed; inset:0; background:rgba(45,42,38,.25); z-index:18; display:none;}
.overlay.show{display:block;}

.layout{display:flex; min-height:100vh; width:100%; max-width:100%; overflow-x:hidden;}

/* ---- 左侧导航栏 ---- */
.sidebar{
  width:230px; flex-shrink:0; background:var(--sidebar);
  padding:16px 14px; display:flex; flex-direction:column;
  border-right:var(--bd);
}
.brand{font-size:calc(20px * var(--fs)); font-weight:700; padding:6px 10px 12px; color:var(--text); letter-spacing:.5px; transform:scaleX(var(--sx)); transform-origin:left center;}
.nav{display:flex; flex-direction:column; gap:4px; flex:1; overflow-y:auto; transform:scaleX(var(--sx)); transform-origin:left center;}
.sidebar-foot{font-size:calc(12px * var(--fs)); color:var(--muted); text-align:center; padding-top:10px; transform:scaleX(var(--sx)); transform-origin:center;}
.backup-btns{display:inline-flex; gap:4px; margin-left:2px;}
.mini-btn{font:inherit; font-size:calc(11px * var(--fs)); line-height:1; color:var(--muted); background:transparent; border:1px solid var(--line,#e6e0d4); border-radius:7px; padding:3px 6px; cursor:pointer; transform:scaleX(var(--sx)); transform-origin:center;}
.mini-btn:hover{color:var(--ink); border-color:var(--ink);}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:7px 12px 7px 20px; border-radius:var(--r-sm);
  text-decoration:none; color:var(--text); font-size:calc(15px * var(--fs));
  border:2px solid transparent;
}
.nav-item .nav-icon{font-size:calc(20px * var(--fs));}
.nav-item:active{background:var(--sidebar-2);}
.nav-item.active{background:#fff; font-weight:700; border-color:var(--line); box-shadow:2px 3px 0 rgba(0,0,0,.08);}

/* ---- 主内容 ---- */
.view{padding:22px; flex:1; max-width:720px; margin:0 auto; width:100%; min-width:0; box-sizing:border-box; transform:scaleX(var(--sx));}
.sec-title{font-size:calc(20px * var(--fs)); margin:calc(10px + env(safe-area-inset-top)) 0 14px; letter-spacing:.5px; font-weight:700;}

/* ---- 概览：时钟 ---- */
.hero{
  background:#fff;
  border:var(--bd); border-radius:var(--r);
  padding:28px 20px; text-align:center;
  box-shadow:3px 4px 0 rgba(0,0,0,.06);
}
.hero-greet{font-size:calc(15px * var(--fs)); color:var(--muted); margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap;}
.hero-ic{width:1.1em; height:1.1em; flex:none;}
.hero-quote{font-size:calc(17px * var(--fs)); color:var(--ink); font-weight:600; line-height:1.5;}
.hero-quote-from{font-size:calc(13px * var(--fs)); color:var(--muted); margin:-2px 0 8px;}
.clock-time{font-size:calc(44px * var(--fs)); font-weight:700; letter-spacing:2px; color:var(--ink);}
.clock-date{font-size:calc(15px * var(--fs)); color:var(--muted); margin-top:6px;}
.hero #clockDate{margin:6px 0 0; font-size:calc(15px * var(--fs)); color:var(--muted); text-align:center; letter-spacing:0; font-weight:400;}

/* ---- 天气卡片（置于时钟下方） ---- */
.weather-card{
  display:block;
  background:#fff;
  border:var(--bd); border-radius:var(--r);
  padding:14px 20px; margin:18px 0 0; color:var(--text);
  box-shadow:3px 4px 0 rgba(0,0,0,.06);
}
.wx-city,.wx-cond,.wx-hum,.wx-run-title,.wx-run-note,.wx-run-meta,.wx-loading,.wx-error{color:var(--muted);}
.wx-temp{font-size:calc(28px * var(--fs)); font-weight:700; line-height:1.1; color:var(--ink);}
/* 用显式 margin 控制行距（而非 flex gap），兼容老版本 iOS Safari */
.wx-topline{
  display:flex; align-items:baseline; gap:8px; flex-wrap:nowrap; white-space:nowrap;
  margin-bottom:6px;
}
.wx-run{
  border-top:none; padding-top:0;
  display:block; margin-top:0;
}
.wx-run-time{font-size:calc(20px * var(--fs)); font-weight:700; color:var(--ink); flex:0 0 auto;}
.wx-run-meta{font-size:calc(15px * var(--fs)); color:var(--muted); margin-bottom:6px;}
.wx-run-note{font-size:calc(13px * var(--fs)); color:var(--muted); display:flex; align-items:center; gap:4px;}
/* 天气卡片：与 grug 纸墨配色统一（去掉原蓝色强调，沿用 muted/ink 配色） */
.wx-run-line{
  display:flex; align-items:baseline; gap:10px; flex-wrap:nowrap; overflow:hidden;
}
.wx-run-title{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0;}

/* ---- 今日打卡卡片：左侧圆环 + 右侧清单 ---- */
.checkin-card{
  display:flex; align-items:center; gap:20px; flex-wrap:wrap; justify-content:center;
  background:var(--card); border:var(--bd);
  border-radius:var(--r);
  padding:18px 20px; margin:18px 0 22px;
  box-shadow:3px 4px 0 rgba(0,0,0,.06);
}
.ring-wrap{position:relative; flex:0 0 auto; width:120px; height:120px;}
.ring{display:block;}
.ring-track{fill:none; stroke:var(--line); stroke-width:12;}
.ring-fill{
  fill:none; stroke:var(--ink); stroke-width:12; stroke-linecap:round;
  transition:stroke-dashoffset .6s ease;
}
.ring-label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:calc(28px * var(--fs)); font-weight:700; color:var(--ink);
}
.ring-pct{font-size:calc(15px * var(--fs)); font-weight:700; margin-left:1px;}

.checkin-list{flex:1 1 180px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 12px; min-width:0;}
.check-row{
  display:flex; align-items:center; gap:8px; text-decoration:none;
  color:var(--text); font-size:calc(14px * var(--fs)); padding:2px 0 2px 8px; min-width:0;
}
.check-row .box{
  width:20px; height:20px; flex:0 0 auto; border:2px solid var(--muted);
  border-radius:var(--r-xs); display:flex; align-items:center; justify-content:center;
  font-size:calc(12px * var(--fs)); color:#fff; line-height:1; transition:all .2s ease;
}
.check-row.done .box{background:var(--muted); border-color:var(--muted);}
.check-row .row-title{
  white-space:nowrap; line-height:1.25; word-break:normal; overflow:hidden; text-overflow:ellipsis;
  min-width:0; flex:1 1 0;
}
.check-row.done .row-title{color:var(--muted); text-decoration:line-through;}

/* ---- 今日灵感便签卡片（首页） ---- */
.idea-card{
  display:block; text-decoration:none;
  background:#fff; border:var(--bd);
  border-radius:var(--r);
  padding:18px 20px; margin:18px 0 22px;
  box-shadow:3px 4px 0 rgba(0,0,0,.06);
  cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
  transform:rotate(-0.8deg); color:var(--text);
}
.idea-card:active{transform:rotate(-0.8deg) translate(2px,3px); box-shadow:none;}
.idea-head{display:flex; justify-content:space-between; align-items:center; font-size:calc(16px * var(--fs)); font-weight:700; color:var(--ink);}
.idea-count{font-size:calc(13px * var(--fs)); font-weight:500; color:var(--muted);}
.idea-body{margin:12px 0; font-size:calc(15px * var(--fs)); color:var(--text);}
.idea-text{white-space:pre-wrap; word-break:break-word; line-height:1.6;}
.idea-thumb{margin-top:10px;}
.idea-thumb img{width:100%; max-height:160px; object-fit:cover; border-radius:12px; display:block;}
.idea-empty{color:var(--muted);}
.idea-write{
  display:inline-block;
  border:none; background:#fff; color:var(--ink); font-weight:700;
  padding:9px 16px; border-radius:var(--r-sm);
  font-size:calc(14px * var(--fs)); cursor:pointer; box-shadow:2px 3px 0 rgba(0,0,0,.08);
}
.idea-write:active{background:var(--bg); transform:translate(1px,2px); box-shadow:none;}

/* 首页「每日计划」小卡片（从打卡环抽出，单独展示） */
.dp-card{
  display:block; text-decoration:none;
  background:#fff; border:var(--bd);
  border-radius:var(--r);
  padding:16px 20px; margin:0 0 18px;
  box-shadow:3px 4px 0 rgba(0,0,0,.06);
  cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
  transform:rotate(0.7deg); color:var(--text);
}
.dp-card:active{transform:rotate(0.7deg) translate(2px,3px); box-shadow:none;}
.dp-head{display:flex; justify-content:space-between; align-items:center; font-size:calc(16px * var(--fs)); font-weight:700; color:var(--ink);}
.dp-count{font-size:calc(13px * var(--fs)); font-weight:500; color:var(--muted);}
.dp-list{margin:12px 0; display:flex; flex-direction:column; gap:6px;}
.dp-item{display:flex; align-items:flex-start; gap:8px; font-size:calc(15px * var(--fs)); color:var(--text);}
.dp-item.done{color:var(--muted); text-decoration:line-through;}
.dp-check{flex:none; width:18px; height:18px; border:1.5px solid var(--line,#e6e0d4); border-radius:5px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; color:var(--ok,#3a9d6b);}
.dp-text{white-space:pre-wrap; word-break:break-word; line-height:1.5;}
.dp-empty{margin:12px 0; color:var(--muted);}
.dp-write{
  display:inline-block;
  border:none; background:#fff; color:var(--ink); font-weight:700;
  padding:9px 16px; border-radius:var(--r-sm);
  font-size:calc(14px * var(--fs)); cursor:pointer; box-shadow:2px 3px 0 rgba(0,0,0,.08);
}
.dp-write:active{background:var(--bg); transform:translate(1px,2px); box-shadow:none;}

/* ---- 日记模板（每日灵感） ---- */
.diary-page{
  max-width:620px; margin:0 auto; padding:8px 6px 28px;
}
.diary-top{
  text-align:center; margin-bottom:18px;
}
.diary-clip{
  width:84px; height:84px; margin:0 auto 8px;
  color:var(--ink);
}
.diary-clip .ic{width:100%; height:100%; stroke-width:1.4;}
.diary-date{
  font-size:calc(15px * var(--fs)); color:var(--muted); margin-bottom:4px;
}
.diary-title{
  font-size:calc(26px * var(--fs)); font-weight:700; color:var(--ink);
  margin:0 0 18px; letter-spacing:1px;
}
.diary-weather-row{
  margin-bottom:14px;
}
.diary-weather-row input{
  width:100%; padding:10px 12px; border:var(--bd); border-radius:var(--r-sm);
  background:#fff; font-size:calc(15px * var(--fs));
}
.diary-fields{display:flex; flex-direction:column; gap:14px;}
.diary-field{
  display:flex; flex-direction:column; gap:6px;
  background:#fff; border:var(--bd); border-radius:var(--r);
  padding:14px 16px;
}
.diary-label{
  font-size:calc(15px * var(--fs)); font-weight:700; color:var(--ink);
}
.diary-field textarea{
  width:100%; border:none; background:transparent;
  font-size:calc(15px * var(--fs)); line-height:1.7;
  resize:vertical; min-height:70px; outline:none;
}
.diary-actions{
  display:flex; align-items:center; gap:14px; margin-top:20px;
}
.diary-count{
  font-size:calc(13px * var(--fs)); color:var(--muted);
}

/* ---- 日记查看弹窗（从月历点絮絮叨叨进入，只读） ---- */
.diary-view-modal{
  background:#fffdf5; border:var(--bd); border-radius:var(--r);
  max-width:520px; width:100%; max-height:85vh;
  display:flex; flex-direction:column;
}
.diary-view-body{
  flex:1; overflow-y:auto; padding:14px 4px;
  background-image:repeating-linear-gradient(transparent,transparent 27px,#eee8d8 28px);
}
.diary-view{
  max-width:560px; margin:0 auto; padding:8px 4px 20px;
}
.diary-view-top{
  text-align:center; margin-bottom:18px;
}
.diary-view-clip{
  width:72px; height:72px; margin:0 auto 8px; color:var(--ink);
}
.diary-view-clip .ic{width:100%; height:100%; stroke-width:1.4;}
.diary-view-date{
  font-size:calc(14px * var(--fs)); color:var(--muted); margin-bottom:6px;
}
.diary-view-title{
  font-size:calc(24px * var(--fs)); font-weight:700; color:var(--ink);
  margin:0 0 14px; letter-spacing:1px;
}
.diary-view-weather{
  background:#fff; border:var(--bd); border-radius:var(--r-sm);
  padding:12px 14px; margin-bottom:14px;
}
.diary-view-weather-label{
  font-size:calc(14px * var(--fs)); font-weight:700; color:var(--ink); margin-bottom:4px;
}
.diary-view-weather-text{
  font-size:calc(14px * var(--fs)); color:var(--text); line-height:1.6;
}
.diary-view-list{
  display:flex; flex-direction:column; gap:12px;
}
.diary-view-item{
  background:#fff; border:var(--bd); border-radius:var(--r-sm);
  padding:14px 16px;
}
.diary-view-item-label{
  font-size:calc(15px * var(--fs)); font-weight:700; color:var(--ink); margin-bottom:6px;
}
.diary-view-item-text{
  font-size:calc(15px * var(--fs)); color:var(--text); line-height:1.7;
  white-space:pre-wrap; word-break:break-word;
}
.diary-view-item-empty{
  font-size:calc(14px * var(--fs)); color:var(--muted); line-height:1.7;
}
/* 今日份哗啦啦：一段汇总的流水，不分小框；标签与内容同行，内容可自动换行 */
.diary-view-flow{
  background:var(--bg); border:none; border-radius:var(--r);
  padding:6px 2px; display:flex; flex-direction:column; gap:8px;
}
.dv-row{ line-height:1.9; }
.dv-label{
  display:inline; font-size:calc(15px * var(--fs)); font-weight:700; color:var(--ink);
}
.dv-text{
  display:inline; font-size:calc(15px * var(--fs)); color:var(--text);
  white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word;
}
.dv-empty{
  font-size:calc(15px * var(--fs)); color:var(--muted); line-height:1.85; text-align:center;
}

/* ---- 弹窗（灵感便签） ---- */
.modal-mask{
  position:fixed; inset:0; z-index:40; display:none;
  align-items:center; justify-content:center;
  background:rgba(45,42,38,.25); padding:18px;
  overflow-x:hidden; overflow-y:auto;
}
.modal-mask.show{display:flex;}
.modal{
  width:100%; max-width:440px; background:#fff;
  border:var(--bd); border-radius:var(--r);
  padding:20px; box-shadow:5px 7px 0 rgba(0,0,0,.12);
  transform:scaleX(var(--sx));
  animation:notePop .18s ease;
}
@keyframes notePop{from{transform:scaleX(var(--sx)) scale(.94); opacity:0;} to{transform:scaleX(var(--sx)) scale(1); opacity:1;}}
/* 便签风格：纸 + 横条纹 */
.modal.note{
  background:#fffdf5; border:var(--bd);
  background-image:repeating-linear-gradient(transparent,transparent 27px,#eee8d8 28px);
  border-radius:var(--r);
}
.note-head{font-size:calc(18px * var(--fs)); font-weight:700; color:var(--ink); margin-bottom:10px;}
.note-text{
  width:100%; min-height:120px; resize:vertical; font-size:calc(16px * var(--fs)); line-height:28px;
  border:none; border-radius:var(--r-sm); background:var(--bg);
  padding:10px 12px; color:var(--text);
}
.note-text:focus{outline:none; border-color:var(--muted);}
.note-img-row{display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap;}
.note-img-btn{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  border:none; background:#fff; color:var(--ink); font-size:calc(14px * var(--fs)); font-weight:700;
  padding:8px 14px; border-radius:var(--r-sm);
  box-shadow:2px 3px 0 rgba(0,0,0,.08);
}
.note-img-btn:active{background:var(--bg); transform:translate(1px,2px); box-shadow:none;}
.note-img-preview img{width:84px; height:84px; object-fit:cover; border-radius:10px; border:none;}

/* 极简打卡模块（如背背单词）：点一下=今天完成 */

        正在加载 My Daily Routine…<br>
        <span style="font-size:13px;opacity:.7;">若长时间空白，请检查网络或杀 App 重开</span>
      </div>
    </main>
  </div>

  <!-- 灵感便签弹窗（静态常驻，不被 #view 重渲染影响） -->
  <div class="modal-mask" id="ideaModal">
    <div class="modal note">
      <div class="note-head"><span class="ic" data-ic="spark"></span> 写点灵感…</div>
      <textarea id="noteText" class="note-text" placeholder="突然冒出来的点子、一句话、灵感碎片…"></textarea>
      <div class="note-img-row">
        <label class="note-img-btn"><span class="ic" data-ic="camera"></span> 加图片
          <input type="file" id="noteImg" accept="image/*" hidden>
        </label>
        <div class="note-img-preview" id="noteImgPrev"></div>
      </div>
      <div class="note-actions">
        <button id="noteCancel" class="btn-cancel" type="button">取消</button>
        <button id="noteSave" class="btn-save" type="button">保存便签</button>
      </div>
    </div>
  </div>

  <!-- 月历：点带记录的日期，弹出当天各模块记录 -->
  <div class="modal-mask" id="dayModal">
    <div class="modal day">
      <div class="day-head"><span class="ic" data-ic="cal"></span> 当日记录 <span id="dayModalDate" class="day-date"></span></div>
      <div class="day-body" id="dayModalBody"></div>
      <div class="day-actions">
        <button id="dayModalCancel" class="btn-cancel" type="button">关闭</button>
      </div>
    </div>
  </div>

  <!-- 运动记录录入弹窗：截图识别或手动添加时弹出 -->
  <div class="modal-mask" id="sportFormModal">
    <div class="modal sport-form-modal">
      <div class="day-head"><span class="ic" data-ic="run"></span> 添加运动记录</div>
      <form id="sport-form" class="add-form modal-form">
        <!-- 字段由 app.js 在打开弹窗时填充 -->
      </form>
      <div class="day-actions">
        <button id="sportFormCancel" class="btn-cancel" type="button">取消</button>
        <button type="submit" form="sport-form" class="btn-primary">+ 添加</button>
      </div>
    </div>
  </div>

  <!-- 日记查看弹窗：从月历点「絮絮叨叨」时只读弹出 -->
  <div class="modal-mask" id="diaryViewModal">
    <div class="modal diary-view-modal">
      <div class="day-head"><span class="ic" data-ic="spark"></span> 絮絮叨叨 <span id="diaryViewDate" class="day-date"></span></div>
      <div class="diary-view-body" id="diaryViewBody"></div>
      <div class="day-actions">
        <button id="diaryViewCancel" class="btn-cancel" type="button">关闭</button>
      </div>
    </div>
  </div>

  <!-- Tesseract.js 改为“点击 OCR 时才动态加载”，避免外部脚本阻塞首屏 -->
  <script>
    // 主脚本加载失败时给出明确提示，避免纯白屏
    function onAppError() {
      document.body.innerHTML = '<div style="padding:120px 24px;text-align:center;color:#7a746b;font-size:16px;">' +
        'My Daily Routine 加载失败<br><span style="font-size:13px;opacity:.7;">请检查网络，或杀掉 App 重新打开</span></div>';
    }
    window.addEventListener('error', function(e) { onAppError(); });
  </script>
  <script src="app.js?v166" onerror="onAppError()"></script>
</body>
</html>
